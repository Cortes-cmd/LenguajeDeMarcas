<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Aqui, introduzco los datos de bootstrap y el css que usaré-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San Lorenzo de El Escorial - Información</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css"></head>
<body>
<div class="container mt-5 p-4 bg-white rounded shadow">
    <!-- En mi caso, lo he hecho sobre San Lorenzo en el index-->
    <h1 class="text-center mb-4">Bienvenido a San Lorenzo de El Escorial</h1>
    
    <!-- img del escudo -->
    <div class="text-center mb-4">
        <img src="imgs/San Lorenzo.png" alt="Escudo" style="height:100px;">
    </div>
    <!-- Muestro que fiestas patronales hay-->
    <h4>Fiestas Patronales</h4>
    <ul>
        <li>10 de agosto – San Lorenzo</li>
        <li>12 de octubre – Nuestra Señora del Pilar</li>
    </ul>
    <!-- La ubicacion en tiempo real con el map de google-->
    <h4>Ubicación en el mapa</h4>
    <div class="mb-4">
        <iframe src="https://www.google.com/maps?q=San+Lorenzo+de+El+Escorial,+Madrid&output=embed"></iframe>
    </div>
    <!-- Carousel de imagenes pudiendo deslizarlas y cargando las almacenadas en la carpeta "imgs"-->
    <h4>Galería</h4>
    <div id="carouselImages" class="carousel slide mb-4" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://media.timeout.com/images/105776694/image.jpg" class="d-block w-100" alt="Paisaje">
            </div>
            <div class="carousel-item">
                <img src="imgs/biblioteca_el_escorial.jpg" class="d-block w-100" alt="Monasterio">
            </div>
            <div class="carousel-item">
                <img src="imgs/el-escorial-jardines-y-abantos-.jpg" class="d-block w-100" alt="Monasterio">
            </div>
        </div>
       <!-- Estos dos botones nos permiten deslizarnos entre imagen e imagen--> 
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselImages" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselImages" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <!-- Boton que nos lleva a la pagina del tiempo-->
    <div class="text-center mt-4">
        <a href="Hito_LM_3T-Tiempo.html" class="btn btn-primary">Ver el Tiempo</a>
    </div>
</div>
    <!-- Enlace a bootstrap y el js de bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
